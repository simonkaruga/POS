name: Desktop App Release

# The release is named after the version in apps/desktop/src-tauri/tauri.conf.json (desktop-v1.2.0), because installed apps
# compare their own version with it to decide whether an update exists. To ship one:
#   node apps/desktop/scripts/app-version.mjs --set 1.2.0   (then commit)
#   git tag desktop-v1.2.0 && git push origin desktop-v1.2.0
# or run this workflow by hand from main. Either way the tag and the version files must agree, and the update signing key
# must be set (the job stops with a clear message otherwise).
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub releases

jobs:
  build:
    name: Build — ${{ matrix.platform }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — AppImage (portable) + .deb (Debian/Ubuntu installer)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x86_64

          # Windows — the .exe setup (NSIS). It carries the offline server (database + API), so it is the one Windows installer.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64

          # macOS Intel. Built on the Apple Silicon runner (the Rust target is added below): GitHub retired the macos-13 Intel
          # runner, and a job waiting for it never starts, which would also keep the update manifest from being published.
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS Intel

          # macOS Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple Silicon

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Version and update signing key ────────────────────────────────────────
      # Fail in seconds, not after an hour of building, if the release cannot be updated to from an installed app.
      - name: Check the version and the update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node apps/desktop/scripts/app-version.mjs --check-tag "${{ github.ref_name }}"
          else
            node apps/desktop/scripts/app-version.mjs --check
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Installed apps only accept updates signed with it. Add it (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) under Settings > Secrets and variables > Actions > Secrets. See apps/desktop/README.md, Updates."
            exit 1
          fi

      # ── Rust ──────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'

      # ── Linux system deps ─────────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libglib2.0-dev

      # ── Install npm dependencies ───────────────────────────────────────────────
      # Install web app deps first — Tauri's beforeBuildCommand needs them
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      # Root deps (shared packages, Tauri CLI wrapper, etc.)
      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      # ── Build web frontend ─────────────────────────────────────────────────────
      # Build the React app that Tauri will bundle into the desktop binary.
      # VITE_API_URL is intentionally left as /api/v1 (relative) so the desktop
      # app talks to whatever server URL is configured in the setup wizard.
      - name: Build web frontend
        working-directory: apps/web
        env:
          VITE_API_URL: /api/v1
          # Not used by the desktop app's Google sign-in (that runs in the system
          # browser and gets its client id from the API); kept for web-style builds.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          NODE_ENV: production
        run: npm run build

      # ── Offline server (Windows only) ──────────────────────────────────────────
      # The Windows installer carries its own PostgreSQL and API so a shop can sell with no internet and no server to set up.
      # Assembled here (pinned, hash-checked downloads), proven to run on its own, and packed into the ONE file the installer
      # carries (apps/desktop/src-tauri/resources/server.tar.gz). Other platforms build without it (a placeholder is used).
      - name: Cache the offline-server downloads
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: apps/desktop/.cache/server-bundle
          key: server-bundle-${{ hashFiles('apps/desktop/scripts/server-bundle.pins.json') }}

      - name: Build the offline server
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          # Prisma only reads these to generate its client; nothing connects.
          DATABASE_URL: postgresql://localhost/placeholder
          DIRECT_URL: postgresql://localhost/placeholder
          # The PUBLIC key licences are checked against (a repository variable, not a secret). The build fails without it.
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
        run: |
          npx prisma generate --schema prisma/schema.prisma
          (cd apps/api && npm run build)
          (cd packages/local-server && npm run build)
          node apps/desktop/scripts/build-server-bundle.mjs

      - name: Smoke test the offline server
        if: matrix.platform == 'windows-latest'
        run: node apps/desktop/scripts/smoke-server-bundle.mjs

      # ── Tauri build + GitHub Release ───────────────────────────────────────────
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # beforeBuildCommand rebuilds apps/web, so the Vite env vars must be
          # available to this step as well
          VITE_API_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Updater signing keys (generate with: tauri signer generate)
          # Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repo Secrets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing — only set if secrets exist (requires Apple Developer account)
          # To enable: add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID to GitHub repository secrets
        with:
          projectPath: apps/desktop
          # __VERSION__ is the app version from tauri.conf.json (checked against the tag above), so a by-hand run and a tag
          # push make the same release.
          tagName: desktop-v__VERSION__
          releaseName: 'Faida POS Desktop v__VERSION__'
          # Each platform's signed update file is added to latest.json on this release; the next job copies it to the fixed
          # address installed apps check (see update-manifest below).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            ## Faida POS Desktop

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows 10/11 | `.exe` | Setup. Includes the offline server: works with no internet |
            | macOS 11+ Intel | `.dmg` | For Intel Macs |
            | macOS 11+ Apple Silicon | `.dmg` | For M1/M2/M3 Macs |
            | Ubuntu/Debian | `.deb` | `sudo dpkg -i faida-pos_*.deb` |
            | Linux (all) | `.AppImage` | Portable — `chmod +x` then run |

            ### First-time Setup
            1. Download and install for your platform
            2. Launch the app — the **Setup Wizard** opens automatically
            3. Choose where your data lives: on this computer (works offline) or in Faida Cloud
            4. On this computer: choose server and till, server only, or till only; confirm the folders
            5. Register your business, or sign in

            ### What's included
            - Full POS, Inventory, Reports, HR, Payroll in a native window
            - **VSCU offline eTIMS** — queues KRA submissions when offline
            - **LAN sync** — sync across terminals without internet
            - **Updates**: the app tells the owner when a new version is ready and installs it, saving a backup first
            - Signed licence, activated online once and renewed quietly (works offline)

            ### Upgrading
            Installed apps check for updates by themselves and show a banner to the owner or a manager. Installing it saves a
            backup of your data first, then the app restarts by itself. You can also run the new installer over the old one:
            your data and settings are kept.
          releaseDraft: false
          prerelease: false
          # Windows builds only the NSIS .exe: the MSI would list about 11,000 offline-server files and the offline server needs
          # the NSIS firewall rules. Other platforms build everything, as before.
          args: ${{ matrix.platform == 'windows-latest' && format('--target {0} --bundles nsis', matrix.target) || format('--target {0}', matrix.target) }}

  # ── Update manifest ───────────────────────────────────────────────────────────
  # Installed apps ask ONE fixed address whether a newer version exists. tauri-action writes latest.json on the versioned
  # release; this job checks it and copies it to the release named desktop-updates (a pre-release, so it never becomes the
  # repository's "latest release", which other workflows use). Runs only when every platform built.
  update-manifest:
    name: Publish the update manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy latest.json to the address installed apps check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node apps/desktop/scripts/app-version.mjs)
          mkdir out
          gh release download "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir out
          node -e '
            const m = JSON.parse(require("fs").readFileSync("out/latest.json", "utf8"));
            const want = process.argv[1];
            if (m.version !== want) throw new Error(`latest.json says ${m.version}, expected ${want}`);
            const platforms = Object.entries(m.platforms || {});
            for (const need of ["windows-x86_64", "linux-x86_64", "darwin-x86_64", "darwin-aarch64"]) {
              if (!m.platforms || !m.platforms[need]) throw new Error(`latest.json has no ${need} entry`);
            }
            for (const [name, p] of platforms) {
              if (!p.url || !p.signature) throw new Error(`${name} has no url or signature`);
            }
            console.log("manifest ok:", want, platforms.map(([n]) => n).join(", "));
          ' "$VERSION"
          if ! gh release view desktop-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updates --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Desktop update manifest" \
              --notes "Not a download. Installed Faida desktop apps read latest.json from here to find the newest version."
          fi
          gh release upload desktop-updates out/latest.json --repo "$GITHUB_REPOSITORY" --clobber
