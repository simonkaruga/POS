name: Mobile Apps Release

on:
  push:
    tags:
      - 'mobile-v*'   # git tag mobile-v1.0.0 && git push --tags
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
      app:
        description: 'Which app to build'
        required: true
        default: 'all'
        type: choice
        options: [all, mobile-pos, mobile-customer, mobile-driver, mobile-agent]
      version:
        description: 'Set app version, e.g. 1.1.0 (leave blank to keep the current one)'
        required: false
        type: string

permissions:
  contents: write  # needed to create/update GitHub releases

jobs:

  # ── Version ───────────────────────────────────────────────────────────────────
  # Sets expo.version when — and only when — you ask for it: a mobile-v* tag, or a
  # version typed into the manual run. It is never bumped automatically, because
  # runtimeVersion follows appVersion: changing it stops OTA updates reaching every
  # install on the old version, which is right for a release and wrong for a build.
  #
  # The bump is committed to main so the repo and the APK agree on what shipped;
  # every build job then checks out that exact commit.
  version:
    name: Resolve app version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and commit
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # A tag names the release; a manual run can pass one instead.
          if [[ "${GITHUB_REF}" == refs/tags/mobile-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mobile-v}"
          else
            VERSION="${INPUT_VERSION:-}"
          fi

          if [ -z "$VERSION" ]; then
            echo "No version requested — building the current one."
            echo "version=$(node -p "require('./apps/mobile-pos/app.json').expo.version")" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi

          node scripts/bump-mobile-version.mjs "$VERSION"

          if git diff --quiet; then
            echo "Already at $VERSION — nothing to commit."
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/*/app.json
            git commit -m "chore(mobile): set version to ${VERSION}"
            # A tag build is detached from any branch, so land the bump on main.
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ── Faida POS Cashier App ────────────────────────────────────────────────────
  build-pos:
    name: Android — Faida POS (Cashier)
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-pos' ||
      startsWith(github.ref, 'refs/tags/')
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-pos/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-pos
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-pos
        run: rm -rf android ios .expo

      - name: Ensure EAS project is linked
        working-directory: apps/mobile-pos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already set in app.json — skipping init"
          else
            eas init --non-interactive --force
          fi

      - name: Build Android APK (local)
        working-directory: apps/mobile-pos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Inlined into the bundle so a phone can say which commit it is running.
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/faida-pos-cashier.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faida-pos-cashier-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-pos/build/faida-pos-cashier.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## Faida POS Cashier APK" >> $GITHUB_STEP_SUMMARY
          echo "Build: \`${{ github.ref_name || 'manual' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Profile: \`${{ github.event.inputs.profile || 'preview' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── Faida Order (Customer Self-Service) App ──────────────────────────────────
  build-customer:
    name: Android — Faida Order (Customer)
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-customer' ||
      startsWith(github.ref, 'refs/tags/')
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-customer/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-customer
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-customer
        run: rm -rf android ios .expo

      - name: Ensure EAS project is linked
        working-directory: apps/mobile-customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already set in app.json — skipping init"
          else
            eas init --non-interactive --force
          fi

      - name: Build Android APK (local)
        working-directory: apps/mobile-customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Inlined into the bundle so a phone can say which commit it is running.
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/faida-order-customer.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faida-order-customer-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-customer/build/faida-order-customer.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## Faida Order (Customer) APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── Faida Driver App ─────────────────────────────────────────────────────────
  build-driver:
    name: Android — Faida Driver
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-driver' ||
      startsWith(github.ref, 'refs/tags/')
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-driver/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-driver
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-driver
        run: rm -rf android ios .expo

      - name: Ensure EAS project is linked
        working-directory: apps/mobile-driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already set in app.json — skipping init"
          else
            eas init --non-interactive --force
          fi

      - name: Build Android APK (local)
        working-directory: apps/mobile-driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Inlined into the bundle so a phone can say which commit it is running.
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/faida-driver.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faida-driver-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-driver/build/faida-driver.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## Faida Driver APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── Faida Agent App (Field Sales) ────────────────────────────────────────────
  build-agent:
    name: Android — Faida Agent
    if: >
      github.event.inputs.app == 'all' ||
      github.event.inputs.app == 'mobile-agent' ||
      startsWith(github.ref, 'refs/tags/')
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/mobile-agent/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install app dependencies
        working-directory: apps/mobile-agent
        run: npm ci

      - name: Clean Expo prebuild artifacts
        working-directory: apps/mobile-agent
        run: rm -rf android ios .expo

      # No extra.eas.projectId is committed (the Faida apps are not linked to an Expo
      # project yet). With EXPO_TOKEN set to YOUR Expo account, the first run creates
      # the project under that account; later runs link it by owner+slug. To skip this
      # step, run `eas init` locally once and commit app.json.
      - name: Ensure EAS project is linked
        working-directory: apps/mobile-agent
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "process.exit(require('./app.json').expo?.extra?.eas?.projectId ? 0 : 1)"; then
            echo "projectId already set in app.json — skipping init"
          else
            eas init --non-interactive --force
          fi

      - name: Build Android APK (local)
        working-directory: apps/mobile-agent
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Inlined into the bundle so a phone can say which commit it is running.
          EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
          EXPO_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
        run: |
          mkdir -p build
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --local \
            --output ./build/faida-agent.apk \
            --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: faida-agent-${{ github.ref_name || 'manual' }}.apk
          path: apps/mobile-agent/build/faida-agent.apk
          retention-days: 30

      - name: Add download link to job summary
        run: |
          echo "## Faida Agent APK" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY

  # ── Publish: create/update rolling mobile-latest GitHub Release ───────────────
  publish:
    name: Publish mobile-latest GitHub Release
    needs: [version, build-pos, build-customer, build-driver, build-agent]
    # Publishes whenever ANY app built. It used to require app=all or a tag, so a
    # single-app run produced an APK that never reached the release — the download
    # link kept serving the old build and the fix looked like it had not shipped.
    # Safe now that uploads replace only the assets this run rebuilt.
    if: >
      always() &&
      (needs.build-pos.result == 'success' || needs.build-customer.result == 'success' || needs.build-driver.result == 'success' || needs.build-agent.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-apks
          merge-multiple: true

      - name: List downloaded artifacts
        run: find downloaded-apks -name '*.apk' | sort

      # Deleting the release first meant a partial run wiped the APKs it did not
      # rebuild: if one app failed, the other three published and the failed app's
      # download link 404'd until the next fully green run. Create it only when it
      # is missing, then overwrite asset by asset, so untouched apps keep the last
      # good APK.
      - name: Ensure mobile-latest release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-latest --repo simonkaruga/POS >/dev/null 2>&1 && exit 0
          echo "mobile-latest does not exist yet — creating it"
          gh release create mobile-latest \
            --repo simonkaruga/POS \
            --title "Faida Mobile Apps — Latest Build" \
            --notes "Populated by the Mobile Apps Release workflow." \
            --latest=false

      - name: Upload APKs, replacing only what this run rebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          found=$(find downloaded-apks -name '*.apk')
          if [ -z "$found" ]; then
            echo "::error::No APKs were produced — leaving the existing release untouched"
            exit 1
          fi
          echo "$found" | xargs gh release upload mobile-latest --repo simonkaruga/POS --clobber

      - name: Refresh the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit mobile-latest \
            --repo simonkaruga/POS \
            --title "Faida Mobile Apps — Latest Build" \
            --notes "$(cat <<'EOF'
          ## Faida Mobile Apps — Latest Build

          Auto-updated every time a new `mobile-v*` tag is pushed.

          ### Direct Download Links
          | App | Platform | Link |
          |-----|----------|------|
          | **Faida POS** (Cashier) | Android | [faida-pos-cashier.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-pos-cashier.apk) |
          | **Faida Order** (Customer) | Android | [faida-order-customer.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-order-customer.apk) |
          | **Faida Driver** | Android | [faida-driver.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-driver.apk) |
          | **Faida Agent** (Field Sales) | Android | [faida-agent.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-agent.apk) |

          ### Install on Android
          1. Download the APK on your Android phone
          2. Open the file — Android will ask to allow installs from unknown sources
          3. Tap **Install**

          > iOS builds require TestFlight. Contact support for enterprise distribution.
          EOF
          )"

      - name: Write job summary
        run: |
          echo "## Mobile Apps Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct download links (always point to latest build):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Download |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Faida POS (Cashier) | [faida-pos-cashier.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-pos-cashier.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| Faida Order (Customer) | [faida-order-customer.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-order-customer.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| Faida Driver | [faida-driver.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-driver.apk) |" >> $GITHUB_STEP_SUMMARY
          echo "| Faida Agent | [faida-agent.apk](https://github.com/simonkaruga/POS/releases/download/mobile-latest/faida-agent.apk) |" >> $GITHUB_STEP_SUMMARY
