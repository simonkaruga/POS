services:
  - type: web
    name: faida-api
    runtime: node
    region: frankfurt        # Frankfurt is closest to Kenya (low latency)
    plan: free               # Free tier — sleeps after 15 min inactivity; upgrade to starter ($7/mo) for always-on
    buildCommand: npm ci && bash scripts/render-build.sh
    startCommand: node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && cd apps/api && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns a port via $PORT; NestJS already reads process.env.PORT
      - key: DATABASE_URL
        sync: false           # Paste your Supabase / Neon / external PostgreSQL connection string here
                              # Format: postgresql://user:password@host:5432/dbname?sslmode=require
      - key: DIRECT_URL
        sync: false           # Direct (non-pooled) connection for `prisma migrate deploy`.
                              # Supabase: use the Session pooler (port 5432), NOT the transaction
                              # pooler (:6543) — migrations hang on the transaction pooler.
                              # If your DATABASE_URL is already direct, use the same value.
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a random secret
      - key: ENCRYPTION_KEY
        sync: false           # 64 hex chars — generate with: openssl rand -hex 32
      - key: FRONTEND_URL
        sync: false           # web app origin, e.g. https://faida-pos.vercel.app
                              # REQUIRED. Used for CORS, affiliate/referral emails, customer
                              # delivery tracking links and supplier RFQ quote links. If it is
                              # unset those links are handed to customers as localhost.
      - key: ADMIN_URL
        sync: false           # admin console origin, e.g. https://faida-admin.vercel.app
      - key: EXTRA_ORIGINS
        sync: false           # Comma-separated extra allowed origins (optional)
      # ── Email (Resend) — REQUIRED for affiliate/subscription/receipt emails ──
      - key: RESEND_API_KEY
        sync: false           # from resend.com/api-keys
      - key: EMAIL_FROM
        sync: false           # e.g. "Faida POS <receipts@yourdomain.com>" (verified Resend domain)
      # ── Paystack billing — REQUIRED for subscriptions + affiliate commissions ──
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_STARTER_PLAN
        sync: false           # Paystack plan code for the Starter tier
      - key: PAYSTACK_GROWTH_PLAN
        sync: false
      - key: PAYSTACK_PRO_PLAN
        sync: false
      - key: PAYSTACK_ENTERPRISE_PLAN
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_SECRET
        generateValue: true
      - key: LICENSE_SIGNING_PRIVATE_KEY
        sync: false           # PRIVATE key that signs offline licences; see docs/super-admin-guide.md, License keys
      - key: ETIMS_ENV
        value: test           # Change to "production" once KRA approves your eTIMS credentials
      - key: MPESA_ENV
        value: sandbox        # Change to "production" with live credentials
      - key: KEEP_ALIVE
        value: true           # Enables self-ping every 14 min to reduce cold starts on free tier

# ─── DATABASE ────────────────────────────────────────────────────────────────
# Render's free PostgreSQL expires after 90 days — data gets DELETED.
# Use Supabase (free, permanent) instead:
#   1. Go to supabase.com → New project → Settings → Database → Connection string
#   2. Copy the URI (use "Transaction" mode pooler for serverless, or direct for persistent)
#   3. Paste it as DATABASE_URL in the Render dashboard
#
# Uncomment the section below ONLY if you want Render's built-in DB (dev/testing only):
#
# databases:
#   - name: faida-db
#     databaseName: faida_pos
#     user: faida
#     plan: free             # WARNING: deleted after 90 days — use Supabase for production
#     region: frankfurt
