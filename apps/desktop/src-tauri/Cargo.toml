[package]
name = "faida-pos-desktop"
version = "1.1.3"
edition = "2021"
description = "Faida POS Desktop - Enterprise POS for Kenya"

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs-next = "2"
hostname = "0.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 2.12.x is the last updater release that works with the Tauri core this app is locked to (2.11); 2.13 and later require
# tauri 2.12, which would move the whole app. Move both together when upgrading Tauri.
tauri-plugin-updater = "~2.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
